name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - platform: macos-latest
            goos: darwin
            goarch: amd64
            appname: image-helper-mac-amd64
          - platform: macos-latest
            goos: darwin
            goarch: arm64
            appname: image-helper-mac-arm64
          - platform: ubuntu-latest
            goos: linux
            goarch: amd64
            appname: image-helper-linux-amd64
          - platform: ubuntu-latest
            goos: linux
            goarch: arm64
            appname: image-helper-linux-arm64
          - platform: windows-latest
            goos: windows
            goarch: amd64
            appname: image-helper-windows-amd64.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: ./frontend

      - name: Build application
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-s -w" -o ./bin/${{ matrix.appname }} ./main.go

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.appname }}
          path: ./bin/${{ matrix.appname }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 🎉 Release ${{ github.ref_name }}

            这是一个自动发布的版本，包含以下平台的构建：

            ### 支持的平台
            - macOS (AMD64)
            - macOS (ARM64/M1/M2/M3)
            - Linux (AMD64)
            - Linux (ARM64)
            - Windows (AMD64)

            ### 下载说明
            根据您的操作系统选择对应的二进制文件进行下载。

            ### 构建信息
            - **构建时间**: ${{ github.event.head_commit.timestamp }}
            - **构建者**: ${{ github.actor }}
            - **提交哈希**: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            image-helper-*-amd64
            image-helper-*-arm64
            image-helper-*-amd64.exe

      - name: Upload to Release Assets
        run: |
          # 确保所有构建的二进制文件都上传到 release
          find . -name "image-helper-*" -type f -exec cp {} release/ \;